name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/class-reference.md'
      - 'docs/html/**'
      - 'docs/paper/**'
      - 'include/COINAlgebra/**'
      - 'examples/basic/example_vector.C'
      - 'tests/**'
      - '.github/workflows/documentation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Install documentation dependencies
        run: pnpm --dir docs/html install --frozen-lockfile
      - name: Build documentation
        run: pnpm --dir docs/html build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
